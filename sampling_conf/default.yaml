sampler_partial:
  _target_: mattergen.diffusion.sampling.classifier_free_guidance.GuidedPredictorCorrector.from_pl_module
  N: 1000
  eps_t: ${eval:'1/${.N}'}

  _partial_: true
  guidance_scale: 0.0
  guidance_schedule: constant
  guidance_warmup_frac: 0.1
  guidance_decay_frac: 0.1
  guidance_min_scale: 0.0
  guidance_max_scale: 5.0
  guidance_adaptive_alpha: 0.5
  guidance_adaptive_ema: 0.95
  guidance_adaptive_eps: 1.0e-6
  guidance_trace_path: null
  cfg_acceleration_enabled: false
  cfg_warmup_frac: 0.15
  cfg_convergence_threshold: 0.05
  cfg_consecutive_stable_steps: 3
  cfg_calibration_interval: 10
  cfg_max_reuse_steps: 8
  cfg_extrapolation_enabled: false
  cfg_extrapolation_order: 1
  cfg_fallback_threshold: 0.20
  cfg_min_progress: 0.0
  cfg_max_progress: 1.0
  cfg_trace_path: null
  cfg_trace_mode: auto
  cfg_summary_path: null
  sample_seed: null
  run_id: null
  remove_conditioning_fn:
    _target_: mattergen.property_embeddings.SetUnconditionalEmbeddingType
  keep_conditioning_fn:
    _target_: mattergen.property_embeddings.SetConditionalEmbeddingType
  predictor_partials:
    pos:
      _target_: mattergen.diffusion.wrapped.wrapped_predictors_correctors.WrappedAncestralSamplingPredictor
      _partial_: true
    cell:
      _target_: mattergen.common.diffusion.predictors_correctors.LatticeAncestralSamplingPredictor
      _partial_: true
    atomic_numbers:
      _target_: mattergen.diffusion.d3pm.d3pm_predictors_correctors.D3PMAncestralSamplingPredictor
      predict_x0: True
      _partial_: true

  corrector_partials:
    pos:
      _target_: mattergen.diffusion.wrapped.wrapped_predictors_correctors.WrappedLangevinCorrector
      _partial_: true
      max_step_size: 1e6
      snr: 0.4
    cell:
      _target_: mattergen.common.diffusion.predictors_correctors.LatticeLangevinDiffCorrector
      _partial_: true
      max_step_size: 1e6
      snr: 0.2

  n_steps_corrector: 1

condition_loader_partial:
  _partial_: true
  _target_: mattergen.common.data.condition_factory.get_number_of_atoms_condition_loader
